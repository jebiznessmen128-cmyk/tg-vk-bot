name: Telegram -> VK Forwarder

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  forward:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Восстановить состояние (last_ids.json)
        uses: actions/cache@v4
        with:
          path: last_ids.json
          key: last-ids-${{ github.run_id }}
          restore-keys: |
            last-ids-

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запустить форвардер
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_ID: ${{ secrets.VK_USER_ID }}
          SOURCE_CHATS: ${{ secrets.SOURCE_CHATS }}
        run: python forwarder.py
