name: Telegram -> VK Forwarder

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  forward:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запустить форвардер
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_ID: ${{ secrets.VK_USER_ID }}
          SOURCE_CHATS: ${{ secrets.SOURCE_CHATS }}
        run: python forwarder.py

      - name: Сохранить состояние
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_ids.json
          git commit -m "Update last_ids.json" || exit 0
          git push
